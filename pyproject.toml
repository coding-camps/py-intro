dependencies = [
    "exifread>=3.5.1",
    "ffmpeg>=1.4",
    "matplotlib>=3.10.7",
    "moviepy>=2.2.1",
    "notebook>=7.5.0",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "piexif>=1.1.3",
    "pillow>=11.3.0",
    "plotly>=6.5.0",
    "pypdf>=6.4.1",
    "seaborn>=0.13.2",
    "streamlit>=1.52.1",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[[tool.uv.index]]
